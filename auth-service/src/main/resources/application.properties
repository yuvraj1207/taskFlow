spring.application.name=auth-service
server.port=8081
spring.config.import=optional:configserver:http://localhost:8888
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:mysql://localhost:3306/authdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# HS256 needs a key of at least 32 characters. Set JWT_SECRET in production.
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-to-a-long-random-value-1234567890}
jwt.expiration-ms=3600000

# Password for the seeded admin account
app.admin.password=${ADMIN_PASSWORD:Admin12345}